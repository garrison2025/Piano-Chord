name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify music and page contracts
        run: npm run test
      - name: Build Astro static website
        run: npm run build
      - name: Assert generated deliverables
        run: |
          test -f dist/index.html
          test -f dist/chords/index.html
          test -f dist/chords/b-minor/index.html
          test -f dist/tools/chord-finder/index.html
          test -f dist/diagrams/b-minor.svg
          test -f dist/sitemap.xml
      - name: Upload built static website for review
        uses: actions/upload-artifact@v4
        with:
          name: piano-chord-static-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
