name: Mobile Performance Lab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/mobile-lab-audit.mjs'
      - '.github/workflows/mobile-performance-lab.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/mobile-lab-audit.mjs'
      - '.github/workflows/mobile-performance-lab.yml'
jobs:
  synthetic-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Record current production mobile baseline
        run: |
          node scripts/mobile-lab-audit.mjs
          mv test-results/performance/mobile-lab.json test-results/performance/production-reference.json
        env:
          PERF_ORIGIN: https://pianochordexplorer.com
      - name: Build proposed static site
        run: npm run build
      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/piano-mobile-preview.log 2>&1 &
          sleep 2
      - name: Measure proposed mobile build and reject viewport overflow
        run: |
          node scripts/mobile-lab-audit.mjs
          mv test-results/performance/mobile-lab.json test-results/performance/proposed-build.json
        env:
          PERF_ORIGIN: http://127.0.0.1:4173
          PERF_FAIL_ON_OVERFLOW: '1'
      - name: Save baseline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piano-chord-synthetic-mobile-lab
          path: test-results/performance/
          if-no-files-found: ignore
          retention-days: 14
