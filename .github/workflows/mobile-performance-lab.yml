name: Mobile Performance Lab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/mobile-lab-audit.mjs'
      - '.github/workflows/mobile-performance-lab.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/mobile-lab-audit.mjs'
      - '.github/workflows/mobile-performance-lab.yml'
jobs:
  synthetic-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Measure public mobile pages under repeatable synthetic throttling
        run: node scripts/mobile-lab-audit.mjs
        env:
          PERF_ORIGIN: https://pianochordexplorer.com
      - name: Save baseline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piano-chord-synthetic-mobile-lab
          path: test-results/performance/
          if-no-files-found: ignore
          retention-days: 14
